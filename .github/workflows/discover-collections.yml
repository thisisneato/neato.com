name: Discover Framer Collections (one-time)

on:
  workflow_dispatch: {}

jobs:
  list-collections:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install framer-api
        run: npm install framer-api

      - name: List collections
        env:
          FRAMER_API_KEY: ${{ secrets.FRAMER_API_KEY }}
          FRAMER_PROJECT_URL: ${{ secrets.FRAMER_PROJECT_URL }}
        run: |
          cat > list-collections.mjs << 'EOF'
          import { connect } from "framer-api";

          const framer = await connect(process.env.FRAMER_PROJECT_URL, process.env.FRAMER_API_KEY);
          try {
            const collections = await framer.getCollections();
            console.log("\nCollections in this Framer project:\n");
            for (const c of collections) {
              console.log(`  ${c.name}  ->  ${c.id}`);
            }
          } finally {
            await framer.disconnect();
          }
          EOF
          node list-collections.mjs
