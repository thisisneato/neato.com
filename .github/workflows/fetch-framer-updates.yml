name: Build sitemap from Framer

on:
  schedule:
    - cron: '23 13 * * *'   # daily, ~6:23 am Pacific (GitHub uses UTC)
  workflow_dispatch: {}     # "Run workflow" button for an immediate refresh

concurrency:
  group: sitemap
  cancel-in-progress: false

jobs:
  build-sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install framer-api ws

      - name: Build sitemap.xml
        env:
          FRAMER_API_KEY: ${{ secrets.FRAMER_API_KEY }}
          FRAMER_PROJECT_URL: ${{ secrets.FRAMER_PROJECT_URL }}
          FRAMER_BLOG_COLLECTION_ID: ${{ secrets.FRAMER_BLOG_COLLECTION_ID }}
        run: node scripts/build-sitemap.js

      - name: Check sitemap is valid XML
        run: python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('sitemap.xml'); print('sitemap.xml is valid XML')"

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: rebuild sitemap.xml from Framer"
          file_pattern: sitemap.xml blog-updates.json
